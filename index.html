<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRO Legends Ultimate Tracker</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-live: #321c24;
            --accent: #38bdf8;
            --text: #f8fafc;
            --highlight: #fbbf24;
            --danger: #ef4444;
            --success: #10b981;
            --input-bg: #334155;
            --border: #334155;
            --muted: #64748b;
            --badge-inactive: #94a3b8;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 20px 100px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .clock-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            font-weight: 600;
        }

        .btn {
            background: var(--border);
            color: white;
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover { background: var(--accent); color: var(--bg); }
        .btn.active { background: var(--accent); color: var(--bg); font-weight: bold; }
        .btn-add { background: var(--success); border-color: var(--success); font-weight: bold; }
        .btn-add:disabled { background: var(--muted); border-color: var(--muted); cursor: not-allowed; opacity: 0.5; }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
            position: absolute;
            right: 10px;
            top: 10px;
        }

        .manual-entry {
            background: var(--card);
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--highlight);
        }

        .manual-entry h3 {
            margin: 0;
            text-align: center;
            color: var(--highlight);
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }

        input, select {
            background: var(--input-bg);
            color: white;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        input[type="number"] { width: 60px; -moz-appearance: textfield; appearance: textfield; outline: none; }
        input[type="number"].invalid { border-color: var(--danger); }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 20px auto;
        }

        .section-title {
            width: 100%;
            max-width: 1400px;
            margin: 50px auto 10px;
            border-left: 5px solid var(--accent);
            padding-left: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid transparent;
            border-top: 4px solid var(--accent);
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            transition: opacity 0.2s, border-color 0.2s, background 0.2s;
        }

        .card.manual-card { border-top-color: var(--highlight); }
        .card.inactive { opacity: 0.42; filter: grayscale(0.65); }

        /* Live scheduled events remain visible and are clearly red. */
        .card.live-event {
            <!--background: var(--card-live);-->
            border-color: rgba(239, 68, 68, 0.65);
            border-top-color: var(--danger);
            opacity: 1;
            filter: none;
            animation: livePulse 1.5s infinite;
        }

        .card.live-event h2,
        .card.live-event .timer,
        .card.live-event .status-badge,
        .card.live-event .countdown-label {
            color: var(--danger);
        }

        .card.active-alert:not(.live-event) {
            border-top-color: var(--danger);
            animation: soonPulse 1.5s infinite;
        }

        @keyframes livePulse {
            0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.50); }
            70%  { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes soonPulse {
            0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
            70%  { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .card h2 { margin: 4px 0 0; color: var(--accent); font-size: 1.3rem; }

        .status-badge {
            display: inline-block;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
        }

        .countdown-label {
            margin-top: 12px;
            color: var(--muted);
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .timer {
            font-size: 2.4rem;
            font-weight: bold;
            font-family: monospace;
            margin: 3px 0 10px;
            color: #fff;
        }

        .meta-line {
            color: var(--muted);
            font-size: 0.82rem;
            margin-top: 2px;
        }

        .info-table {
            width: 100%;
            border-top: 1px solid var(--border);
            margin-top: 10px;
            padding-top: 10px;
            font-size: 0.85rem;
        }

        .info-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
        .info-row span:last-child { text-align: right; }
        .val { font-weight: bold; color: var(--highlight); }
        .local-val { color: var(--success); }
        .live-val { color: var(--danger); }
        .empty-state { grid-column: 1 / -1; text-align: center; color: var(--muted); }

        .boss-search {
            position: relative;
            width: 260px;
        }

        .boss-search input {
            width: 100%;
            text-align: left;
        }

        .boss-dropdown {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: var(--card);
            border: 1px solid #475569;
            z-index: 10;
        }

        .boss-dropdown.open { display: block; }

        .boss-dropdown.drop-down {
            top: 100%;
            border-top: none;
            border-radius: 0 0 6px 6px;
        }

        .boss-dropdown.drop-up {
            bottom: 100%;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
        }

        .boss-option {
            padding: 8px 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .boss-option:hover,
        .boss-option.highlighted {
            background: var(--accent);
            color: var(--bg);
        }

        @media (max-width: 620px) {
            body { padding-left: 12px; padding-right: 12px; }
            .clock-bar { gap: 10px 24px; }
            .grid { grid-template-columns: 1fr; }
            .section-title { margin-top: 32px; }
            .timer { font-size: 2.1rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Silkroad Legends Tracker</h1>
    <div class="clock-bar">
        <div>🌍 Your time: <span id="local-clock" style="color: var(--success)">--:--:--</span></div>
        <div>🏰 Server time (UTC+3): <span id="server-clock" style="color: var(--highlight)">--:--:--</span></div>
    </div>
</div>

<div class="section-title">
    <h2>Event Schedule</h2>
    <button class="btn" id="toggle-today" onclick="toggleTodayOnly()">Show All</button>
</div>
<div class="grid" id="event-grid"></div>

<div class="manual-entry">
    <h3>Add Custom Respawn</h3>
    <div class="input-group">
        <div class="boss-search" id="boss-search">
            <input type="text" id="boss-input" placeholder="Search boss..." aria-label="Search boss" autocomplete="off">
            <div class="boss-dropdown" id="boss-dropdown"></div>
        </div>
        <span>Killed ago:</span>
        <input type="number" id="killed-hours" placeholder="0" min="0" aria-label="Hours ago">h
        <input type="number" id="killed-minutes" placeholder="0" min="0" max="59" aria-label="Minutes ago">m
        <button class="btn btn-add" id="add-timer" onclick="addManualBoss()">+ Add Timer</button>
    </div>
</div>

<script src="events.js"></script>
<script src="bosses.js"></script>
<script>
    // ---------- Constants ----------
    const MS_PER_SECOND = 1_000;
    const MS_PER_MINUTE = 60_000;
    const MS_PER_HOUR = 3_600_000;
    const MS_PER_DAY = 86_400_000;
    const SERVER_UTC_OFFSET = 3; // fixed server time UTC+3
    const ALERT_THRESHOLD_MS = 10 * MS_PER_MINUTE;
    const STORAGE_KEY = 'sro_manual_timers';
    const MAX_DAYS_LOOKAHEAD = 8;
    const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    // ---------- DOM ----------
    const dom = {
        localClock:    document.getElementById('local-clock'),
        serverClock:   document.getElementById('server-clock'),
        eventGrid:     document.getElementById('event-grid'),
        bossInput:     document.getElementById('boss-input'),
        bossDropdown:  document.getElementById('boss-dropdown'),
        killedHours:   document.getElementById('killed-hours'),
        killedMinutes: document.getElementById('killed-minutes'),
        addTimer:      document.getElementById('add-timer'),
        toggleToday:   document.getElementById('toggle-today'),
    };

    // ---------- State ----------
    let todayOnly = false;
    let selectedBoss = null;
    let highlightedIndex = -1;
    let manualBosses = loadManualBosses();

    function loadManualBosses() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch { return []; }
    }

    function saveManualBosses() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(manualBosses)); }
        catch {}
    }

    // ---------- General helpers ----------
    function formatCountdown(ms) {
        const safeMs = Math.max(0, ms);
        const h = Math.floor(safeMs / MS_PER_HOUR);
        const m = Math.floor((safeMs % MS_PER_HOUR) / MS_PER_MINUTE);
        const s = Math.floor((safeMs % MS_PER_MINUTE) / MS_PER_SECOND);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatTime(hours, minutes) {
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    function eventTimes(event) {
        const source = event.time ?? event.times ?? [];
        return Array.isArray(source) ? source : [source];
    }

    function eventJsonDays(event) {
        // Prefer the original events.json day numbering when compatibility data provides it.
        return Array.isArray(event.jsonDays) ? event.jsonDays : event.days;
    }

    // events.json convention: Monday=0 ... Sunday=6.
    function jsonDayFromJsUtcDay(jsUtcDay) {
        return (jsUtcDay + 6) % 7;
    }

    function getShiftedServerDate(timestampMs) {
        return new Date(timestampMs + SERVER_UTC_OFFSET * MS_PER_HOUR);
    }

    function sameServerCalendarDate(a, b) {
        return a.getUTCFullYear() === b.getUTCFullYear()
            && a.getUTCMonth() === b.getUTCMonth()
            && a.getUTCDate() === b.getUTCDate();
    }

    function occurrenceUtcMs(serverDate, timeStr) {
        const [hour, minute] = timeStr.split(':').map(Number);
        return Date.UTC(
            serverDate.getUTCFullYear(),
            serverDate.getUTCMonth(),
            serverDate.getUTCDate(),
            hour - SERVER_UTC_OFFSET,
            minute,
            0,
            0
        );
    }

    function formatLocalEventTime(timestampMs) {
        const d = new Date(timestampMs);
        return formatTime(d.getHours(), d.getMinutes());
    }

    // ---------- Scheduled events ----------
    // Returns LIVE first when now is between start and start+duration_minutes.
    // Otherwise returns the next future occurrence.
    function findEventState(event, now) {
        const nowMs = now.getTime();
        const durationMs = Math.max(0, Number(event.duration_minutes) || 0) * MS_PER_MINUTE;
        const currentServerDate = getShiftedServerDate(nowMs);
        let live = null;
        let next = null;

        // Start at yesterday so an event crossing server midnight can still be LIVE.
        for (let dayOffset = -1; dayOffset < MAX_DAYS_LOOKAHEAD; dayOffset++) {
            const checkServerDate = new Date(currentServerDate.getTime() + dayOffset * MS_PER_DAY);
            const jsonDay = jsonDayFromJsUtcDay(checkServerDate.getUTCDay());
            if (!eventJsonDays(event).includes(jsonDay)) continue;

            for (const timeStr of eventTimes(event)) {
                const startMs = occurrenceUtcMs(checkServerDate, timeStr);
                const endMs = startMs + durationMs;

                if (durationMs > 0 && nowMs >= startMs && nowMs < endMs) {
                    if (!live || startMs > live.startMs) {
                        live = { startMs, endMs, timeStr, serverDate: checkServerDate };
                    }
                    continue;
                }

                if (startMs > nowMs && (!next || startMs < next.startMs)) {
                    next = { startMs, endMs, timeStr, serverDate: checkServerDate };
                }
            }
        }

        const occurrence = live || next;
        if (!occurrence) return null;

        const isLive = Boolean(live);
        return {
            status: isLive ? 'live' : 'upcoming',
            diffMs: isLive ? occurrence.endMs - nowMs : occurrence.startMs - nowMs,
            startMs: occurrence.startMs,
            endMs: occurrence.endMs,
            displayTimeServer: occurrence.timeStr,
            localDisplay: formatLocalEventTime(occurrence.startMs),
            isOccurrenceToday: sameServerCalendarDate(occurrence.serverDate, currentServerDate),
            occurrenceDay: DAY_NAMES[jsonDayFromJsUtcDay(occurrence.serverDate.getUTCDay())],
        };
    }

    function buildEventCards(now) {
        // events.json splits some weekday/Sunday schedules into separate records
        // with the same display name. Show one card per name, using LIVE first
        // or otherwise whichever occurrence is next.
        const cardsByName = new Map();

        for (const event of EVENTS) {
            const state = findEventState(event, now);
            if (!state) continue;

            const candidate = {
                type: 'event',
                id: event.id,
                name: event.name,
                eventType: event.type || 'Event',
                durationMinutes: Number(event.duration_minutes) || 0,
                registrationMinutes: Number(event.registration_time_before) || 0,
                priority: Number(event.priority) || 0,
                ...state,
            };

            const current = cardsByName.get(event.name);
            const candidateRank = candidate.status === 'live' ? 0 : 1;
            const currentRank = current?.status === 'live' ? 0 : 1;

            if (!current
                || candidateRank < currentRank
                || (candidateRank === currentRank && candidate.diffMs < current.diffMs)) {
                cardsByName.set(event.name, candidate);
            }
        }

        return [...cardsByName.values()];
    }

    // ---------- Manual boss timers ----------
    function bossLabel(boss) {
        return `${boss.name} (${boss.respawnMinutes / 60}h)`;
    }

    function filterBosses(query) {
        const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
        if (terms.length === 0) return BOSSES;
        return BOSSES.filter(boss => {
            const name = boss.name.toLowerCase();
            return terms.every(term => name.includes(term));
        });
    }

    function renderDropdown(matches) {
        highlightedIndex = -1;
        if (matches.length === 0) {
            dom.bossDropdown.innerHTML = '<div class="boss-option" style="color: var(--muted)">No matches</div>';
        } else {
            dom.bossDropdown.innerHTML = matches.map(boss =>
                `<div class="boss-option" data-index="${BOSSES.indexOf(boss)}">${bossLabel(boss)}</div>`
            ).join('');
        }
        dom.bossDropdown.classList.add('open');
    }

    function selectBoss(boss) {
        selectedBoss = boss;
        dom.bossInput.value = bossLabel(boss);
        dom.bossDropdown.classList.remove('open');
        validateInputs();
    }

    function openDropdown() {
        const matches = filterBosses(dom.bossInput.value);
        renderDropdown(matches);
        const inputRect = dom.bossInput.getBoundingClientRect();
        const spaceBelow = window.innerHeight - inputRect.bottom;
        const dropUp = spaceBelow < 220;
        dom.bossDropdown.classList.toggle('drop-up', dropUp);
        dom.bossDropdown.classList.toggle('drop-down', !dropUp);
    }

    function isValidInput(input) {
        if (input.value === '') return true;
        const num = Number(input.value);
        if (!Number.isInteger(num) || num < 0) return false;
        if (input.max && num > Number(input.max)) return false;
        return true;
    }

    function validateInputs() {
        let valid = selectedBoss !== null;
        for (const input of [dom.killedHours, dom.killedMinutes]) {
            const ok = isValidInput(input);
            input.classList.toggle('invalid', !ok);
            if (!ok) valid = false;
        }
        dom.addTimer.disabled = !valid;
        return valid;
    }

    function addManualBoss() {
        if (!validateInputs()) return;

        const spawnIntervalMs = selectedBoss.respawnMinutes * MS_PER_MINUTE;
        const hoursAgo = parseInt(dom.killedHours.value, 10) || 0;
        const minutesAgo = parseInt(dom.killedMinutes.value, 10) || 0;
        const killedAgoMs = hoursAgo * MS_PER_HOUR + minutesAgo * MS_PER_MINUTE;

        manualBosses.push({
            id: Date.now(),
            name: selectedBoss.name,
            targetTimestamp: Date.now() - killedAgoMs + spawnIntervalMs,
        });

        saveManualBosses();
        update();

        selectedBoss = null;
        dom.bossInput.value = '';
        dom.killedHours.value = '';
        dom.killedMinutes.value = '';
        validateInputs();
    }

    function removeManual(id) {
        manualBosses = manualBosses.filter(boss => boss.id !== id);
        saveManualBosses();
        update();
    }

    function buildManualCards(now) {
        return manualBosses.map(boss => {
            const diffMs = boss.targetTimestamp - now.getTime();
            const spawnLocal = new Date(boss.targetTimestamp);
            const spawnServer = getShiftedServerDate(boss.targetTimestamp);

            return {
                type: 'manual',
                status: 'manual',
                diffMs,
                name: boss.name,
                manualId: boss.id,
                displayTimeServer: formatTime(spawnServer.getUTCHours(), spawnServer.getUTCMinutes()),
                localDisplay: formatTime(spawnLocal.getHours(), spawnLocal.getMinutes()),
            };
        });
    }

    // ---------- Rendering ----------
    function toggleTodayOnly() {
        todayOnly = !todayOnly;
        dom.toggleToday.classList.toggle('active', todayOnly);
        dom.toggleToday.textContent = todayOnly ? 'Today Only' : 'Show All';
        update();
    }

    function renderCard(card) {
        const isSoon = card.status !== 'live' && card.diffMs > 0 && card.diffMs < ALERT_THRESHOLD_MS;

        if (card.type === 'manual') {
            return `
                <div class="card manual-card ${isSoon ? 'active-alert' : ''}">
                    <button class="btn-delete" onclick="removeManual(${card.manualId})" aria-label="Remove ${card.name} timer">✖</button>
                    <span class="status-badge" style="color: var(--highlight)">● Manual Spawn</span>
                    <h2>${card.name}</h2>
                    <div class="countdown-label">SPAWNS IN</div>
                    <div class="timer">${card.diffMs > 0 ? formatCountdown(card.diffMs) : 'SPAWNED!'}</div>
                    <div class="info-table">
                        <div class="info-row"><span>Server:</span><span class="val">${card.displayTimeServer}</span></div>
                        <div class="info-row"><span>Local:</span><span class="val local-val">${card.localDisplay}</span></div>
                    </div>
                </div>`;
        }

        const isLive = card.status === 'live';
        const inactive = !isLive && !card.isOccurrenceToday;
        const statusText = isLive
            ? '● LIVE NOW'
            : card.isOccurrenceToday
                ? '● Today'
                : `○ Next ${card.occurrenceDay}`;
        const statusColor = isLive
            ? 'var(--danger)'
            : card.isOccurrenceToday
                ? 'var(--success)'
                : 'var(--badge-inactive)';

        return `
            <div class="card ${isLive ? 'live-event' : ''} ${inactive ? 'inactive' : ''} ${isSoon ? 'active-alert' : ''}">
                <span class="status-badge" style="color: ${statusColor}">${statusText}</span>
                <h2>${card.name}</h2>
                <div class="meta-line">${card.eventType} · ${card.durationMinutes} min</div>
                <div class="countdown-label">${isLive ? 'ENDS IN' : 'STARTS IN'}</div>
                <div class="timer">${formatCountdown(card.diffMs)}</div>
                <div class="info-table">
                    <div class="info-row"><span>Server start:</span><span class="val ${isLive ? 'live-val' : ''}">${card.displayTimeServer}</span></div>
                    <div class="info-row"><span>Local start:</span><span class="val local-val">${card.localDisplay}</span></div>
                    <div class="info-row"><span>Duration:</span><span>${card.durationMinutes} min</span></div>
                    ${card.registrationMinutes > 0 ? `<div class="info-row"><span>Registration:</span><span>${card.registrationMinutes} min before</span></div>` : ''}
                </div>
            </div>`;
    }

    function renderGrid(now) {
        let cards = [...buildEventCards(now), ...buildManualCards(now)];

        if (todayOnly) {
            cards = cards.filter(card =>
                card.type === 'manual' || card.status === 'live' || card.isOccurrenceToday
            );
        }

        // LIVE scheduled events first, then everything else by countdown.
        cards.sort((a, b) => {
            const aRank = a.status === 'live' ? 0 : 1;
            const bRank = b.status === 'live' ? 0 : 1;
            if (aRank !== bRank) return aRank - bRank;
            return a.diffMs - b.diffMs;
        });

        dom.eventGrid.innerHTML = cards.length
            ? cards.map(renderCard).join('')
            : '<div class="empty-state">No events to display.</div>';
    }

    function update() {
        const now = new Date();
        const serverNow = getShiftedServerDate(now.getTime());

        dom.localClock.textContent = now.toLocaleTimeString(undefined, { hour12: false });
        dom.serverClock.textContent = serverNow.toLocaleTimeString('en-GB', {
            timeZone: 'UTC',
            hour12: false,
        });

        renderGrid(now);
    }

    // ---------- Listeners ----------
    for (const input of [dom.killedHours, dom.killedMinutes]) {
        input.addEventListener('input', validateInputs);
    }

    dom.bossInput.addEventListener('focus', openDropdown);
    dom.bossInput.addEventListener('input', () => {
        selectedBoss = null;
        openDropdown();
        validateInputs();
    });

    dom.bossDropdown.addEventListener('mousedown', event => {
        const option = event.target.closest('.boss-option');
        if (!option || option.dataset.index === undefined) return;
        selectBoss(BOSSES[Number(option.dataset.index)]);
    });

    dom.bossInput.addEventListener('keydown', event => {
        const items = dom.bossDropdown.querySelectorAll('.boss-option[data-index]');
        if (!items.length) return;

        if (event.key === 'ArrowDown') {
            event.preventDefault();
            highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            highlightedIndex = Math.max(highlightedIndex - 1, 0);
        } else if (event.key === 'Enter' && highlightedIndex >= 0) {
            event.preventDefault();
            items[highlightedIndex].click();
            return;
        } else if (event.key === 'Escape') {
            dom.bossDropdown.classList.remove('open');
            return;
        } else {
            return;
        }

        items.forEach((item, index) => item.classList.toggle('highlighted', index === highlightedIndex));
        items[highlightedIndex].scrollIntoView({ block: 'nearest' });
    });

    document.addEventListener('click', event => {
        if (!event.target.closest('#boss-search')) {
            dom.bossDropdown.classList.remove('open');
        }
    });

    // ---------- Start ----------
    validateInputs();
    update();
    setInterval(update, MS_PER_SECOND);
</script>
</body>
</html>
